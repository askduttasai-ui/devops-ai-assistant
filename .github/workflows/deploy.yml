name: Build and Deploy AI DevOps Assistant

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-ai-assistant:latest

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/devops-ai-assistant:latest
            docker stop ai-assistant || true
            docker rm ai-assistant || true
            docker run -d -p 5000:5000 -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              --name ai-assistant --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/devops-ai-assistant:latest
